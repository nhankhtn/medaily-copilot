<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medaily Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Settings</p>
        <h1>Medaily <span>Copilot</span></h1>
        <p class="lede">Point the extension at your medaily-ai service, or keep Mock mode on for local demos.</p>
      </header>

      <form id="settings-form" novalidate>
        <label class="field">
          <span>API base URL</span>
          <input
            id="apiBaseUrl"
            name="apiBaseUrl"
            type="url"
            placeholder="https://ai.medaily.id.vn"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field">
          <span>API key</span>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            placeholder="SERVICE_TOKEN (optional in mock mode)"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="toggle">
          <input id="useMock" name="useMock" type="checkbox" />
          <span>
            <strong>Mock mode</strong>
            <small>Skip the network and invent replies from page context.</small>
          </span>
        </label>

        <div class="actions">
          <button type="submit" id="save">Save</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="launcher-card" aria-label="Chat launcher">
        <div class="launcher-copy">
          <strong>Chat launcher</strong>
          <small id="launcher-status">Visible on pages</small>
        </div>
        <button type="button" id="show-launcher" class="secondary">
          Show chat launcher again
        </button>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
