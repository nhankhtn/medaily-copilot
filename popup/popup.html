<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medaily Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Settings</p>
        <h1>Medaily <span>Copilot</span></h1>
        <p class="lede">Pick a model provider and paste its key, Save, then click the teal FAB on the page to open Copilot. Gemini/Claude keys stay on this device and are sent only to Google/Anthropic.</p>
      </header>

      <form id="settings-form" novalidate>
        <label class="field">
          <span>Model provider</span>
          <select id="provider" name="provider">
            <option value="medaily">Medaily AI (SERVICE_TOKEN)</option>
            <option value="gemini">Gemini — direct, free tier</option>
            <option value="anthropic">Claude — direct, paid</option>
          </select>
        </label>

        <label class="field" data-provider="medaily">
          <span>API key</span>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            placeholder="SERVICE_TOKEN"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <label class="field" data-provider="gemini">
          <span>Gemini API key <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">get one free</a></span>
          <input
            id="geminiApiKey"
            type="password"
            placeholder="AIza…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label class="field" data-provider="gemini">
          <span>Gemini model</span>
          <select id="geminiModelSelect">
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite — fast, cheapest</option>
            <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
            <option value="gemini-3.8-flash">Gemini 3.8 Flash — best Flash</option>
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (preview)</option>
            <option value="custom">Custom model ID…</option>
          </select>
          <input id="geminiModel" type="text" placeholder="gemini-…" autocomplete="off" spellcheck="false" />
        </label>

        <label class="field" data-provider="anthropic">
          <span>Claude API key</span>
          <input
            id="anthropicApiKey"
            type="password"
            placeholder="sk-ant-…"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label class="field" data-provider="anthropic">
          <span>Claude model</span>
          <select id="anthropicModelSelect">
            <option value="claude-haiku-5-5">Claude Haiku 5.5 — fast, cheapest</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
            <option value="claude-opus-5-5">Claude Opus 5.5 — most capable</option>
            <option value="custom">Custom model ID…</option>
          </select>
          <input id="anthropicModel" type="text" placeholder="claude-…" autocomplete="off" spellcheck="false" />
        </label>

        <label class="check" data-byok>
          <input id="agentScreenshots" type="checkbox" />
          <span>Agent screenshot each step</span>
        </label>

        <div class="actions">
          <button type="submit" id="save">Save</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="rows" aria-label="Key and launcher settings">
        <div class="row">
          <span class="row-label">Encryption <em id="crypto-status">Off</em></span>
          <span class="row-actions">
            <button type="button" id="enable-crypto" class="mini">Encrypt</button>
            <button type="button" id="unlock" class="mini">Unlock</button>
            <button type="button" id="lock" class="mini">Lock</button>
            <button type="button" id="disable-crypto" class="mini">Turn off</button>
          </span>
        </div>
        <div class="row" id="passphrase-field" hidden>
          <input id="passphrase" type="password" placeholder="Passphrase (8+ chars)" autocomplete="off" spellcheck="false" />
          <button type="button" id="passphrase-ok" class="mini">OK</button>
        </div>
        <div class="row">
          <span class="row-label">Saved keys</span>
          <button type="button" id="clear-keys" class="mini danger">Delete all</button>
        </div>
        <div class="row">
          <span class="row-label">Chat launcher <em id="launcher-status">Visible</em></span>
          <button type="button" id="show-launcher" class="mini">Show</button>
        </div>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
