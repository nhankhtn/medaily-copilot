<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medaily Copilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Settings</p>
        <h1>Medaily <span>Copilot</span></h1>
        <p class="lede">Paste your SERVICE_TOKEN to talk to medaily-ai. The chat launcher can be hidden on pages and restored here.</p>
      </header>

      <form id="settings-form" novalidate>
        <label class="field">
          <span>API key</span>
          <input
            id="apiKey"
            name="apiKey"
            type="password"
            placeholder="SERVICE_TOKEN"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="actions">
          <button type="submit" id="save">Save</button>
          <p id="status" class="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <section class="launcher-card" aria-label="Chat launcher">
        <div class="launcher-copy">
          <strong>Chat launcher</strong>
          <small id="launcher-status">Visible on pages</small>
        </div>
        <button type="button" id="show-launcher" class="secondary">
          Show chat launcher again
        </button>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
